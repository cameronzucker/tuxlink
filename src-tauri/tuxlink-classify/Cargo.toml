# T1 request classifier (ADR 0030, ch3e9 step 2).
#
# CPU embedding retrieval over the enriched Winlink catalog: candle-native
# bge-small (the mandatory offline floor - the 60-300MB T1 RAM budget is
# unreachable through a Python stack), two T0-owned thresholds, and the
# corpus-generic advisory DTO. Classifiers ADVISE; deterministic policy
# DECIDES - nothing in this crate gates anything.
#
# Workspace member, NOT yet a dependency of the tuxlink app: step-3 wiring
# (Elmer flow + any MCP-surface change) is the operator-gated seam per the
# ch3e9 plan.
#
# A prior version of this comment also claimed the crate was held out because
# "candle's MSRV is above the app's declared 1.75". That was never verified and
# is FALSE: candle 0.9 declares no `rust-version` at all. The app's own
# `rust-version = "1.75"` is a scaffold artifact that nothing builds or tests
# against (CI uses `dtolnay/rust-toolchain@stable`) — under review in
# bd tuxlink-qt7zi, operator-decided, do not act on it here. The ML stack is
# kept out of the app's dependency closure by the `t1-candle` feature below,
# which is a real mechanism with a CI check behind it, not by leaving the
# crate unlinked.
[package]
name = "tuxlink-classify"
version = "0.0.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
# Native inference floor. CPU-only: no accelerate/cuda/mkl features - the
# deployment floor is a Pi / small x86 box, and the T1 spike showed 2-4
# intra-op threads is the knee (RAYON_NUM_THREADS governs).
candle-core = { version = "0.9", optional = true }
candle-nn = { version = "0.9", optional = true }
candle-transformers = { version = "0.9", optional = true }
# HF tokenizer.json loader (WordPiece for the BERT family).
tokenizers = { version = "0.21", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[features]
default = ["t1-candle"]
# The candle-backed T1 embedding tier, made OPTIONAL 2026-08-11 so the pure
# layers of this crate (the inbox conversion schema, enriched index,
# thresholds, advisory DTO, and the EmbeddingBackend trait) can be depended
# on by the app WITHOUT dragging an ML stack into its dependency closure.
# That closure was the stated reason the whole crate was kept out of the app
# — which left the conversion schema unreachable by the code that needs it.
# candle is used by exactly one module (`candle_bert`); everything else is
# serde + string rules. Default-on, so existing builds and the evals are
# unchanged; a consumer wanting only the pure schema uses
# `default-features = false`.
t1-candle = [
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:tokenizers",
]

[[example]]
name = "eval_tools"
required-features = ["t1-candle"]

[[example]]
name = "eval_floor"
required-features = ["t1-candle"]
